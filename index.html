    <script>
      (function() {
        // Immediate Workbox/ServiceWorker Nuke & Self-Heal
        try {
          var isControlled = 'serviceWorker' in navigator && !!navigator.serviceWorker.controller;
          var nukeAttempted = sessionStorage.getItem('simpanla_sw_nuked');

          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              if (regs && regs.length) {
                for (var i = 0; i < regs.length; i++) {
                  regs[i].unregister();
                }
              }
            }).catch(function() {});
          }

          if ('caches' in window) {
            caches.keys().then(function(keys) {
              if (keys && keys.length) {
                for (var j = 0; j < keys.length; j++) {
                  caches.delete(keys[j]);
                }
              }
            }).catch(function() {});
          }

          // If current page was hijacked by old service worker, force clean reload once
          if (isControlled && !nukeAttempted) {
            sessionStorage.setItem('simpanla_sw_nuked', '1');
            window.location.reload();
            return;
          }
        } catch (err) {
          console.warn('[SIM-PANLA] Cache clean error:', err);
        }

        // Silence benign DevTools soft navigation & refresh token logs
        function isBenign(msg) {
          if (!msg || typeof msg !== 'string') return false;
          return msg.indexOf("startTime") !== -1 || 
                 msg.indexOf("reportAllChanges") !== -1 || 
                 msg.indexOf("Refresh Token") !== -1 ||
                 msg.indexOf("refresh token") !== -1;
        }

        window.addEventListener('error', function(e) {
          var msg = (e && e.message) ? e.message : '';
          if (isBenign(msg)) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
          if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
            var url = e.target.src || e.target.href || '';
            console.warn('[SIM-PANLA] Asset load issue detected:', url);
            if (url.indexOf('auth-bridge') !== -1 || url.indexOf('index.tsx') !== -1 || url.indexOf('@vite') !== -1 || url.indexOf('react-refresh') !== -1) {
              triggerRecoveryUI('Gagal memuat modul sistem (Koneksi sesi Dev Server perlu diperbarui).');
            }
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && e.reason;
          var msg = reason && (reason.message || reason.toString()) || '';
          if (isBenign(msg)) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);

        // Watchdog: If React hasn't mounted in 6 seconds, display recovery UI with Direct Tab link
        setTimeout(function() {
          var loader = document.getElementById('simpanla-root-loader');
          if (loader) {
            triggerRecoveryUI('Sesi pratinjau browser memerlukan penyegaran.');
          }
        }, 6000);

        function triggerRecoveryUI(msg) {
          var root = document.getElementById('root');
          if (!root) return;
          var loader = document.getElementById('simpanla-root-loader');
          if (!loader) return;

          root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F9F7FF;padding:16px;font-family:\'Plus Jakarta Sans\',sans-serif;color:#1e293b;">' +
            '<div style="max-width:440px;width:100%;background:#ffffff;border-radius:24px;padding:32px;box-shadow:0 10px 25px -5px rgba(147,51,234,0.1),0 8px 10px -6px rgba(0,0,0,0.05);border:1px solid #e2e8f0;text-align:center;">' +
            '<div style="width:64px;height:64px;border-radius:20px;background:#f3e8ff;display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;color:#9333ea;">' +
            '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>' +
            '</div>' +
            '<h2 style="font-size:18px;font-weight:800;color:#0f172a;margin-bottom:8px;">Sinkronkan Sesi Aplikasi</h2>' +
            '<p style="font-size:13px;color:#64748b;line-height:1.6;margin-bottom:20px;">' + (msg || 'Koneksi dev server memerlukan sinkronisasi sesi browser.') + '</p>' +
            '<div style="display:flex;flex-direction:column;gap:10px;">' +
            '<button id="btn-sync-reload" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 20px;background:#9333ea;color:#ffffff;border:none;border-radius:14px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 4px 12px rgba(147,51,234,0.3);">' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>' +
            'Segarkan Sesi</button>' +
            '<a href="' + window.location.href + '" target="_blank" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 20px;background:#f3e8ff;color:#9333ea;border:1px solid #d8b4fe;border-radius:14px;font-weight:700;font-size:13px;text-decoration:none;cursor:pointer;box-sizing:border-box;">' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>' +
            'Buka di Tab Baru (Disarankan)</a>' +
            '</div>' +
            '</div></div>';

          var btn = document.getElementById('btn-sync-reload');
          if (btn) {
            btn.onclick = function() {
              btn.disabled = true;
              btn.innerText = 'Menyambungkan...';
              sessionStorage.removeItem('simpanla_sw_nuked');
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  for (var r of regs) r.unregister();
                  if ('caches' in window) {
                    caches.keys().then(function(ks) {
                      for (var k of ks) caches.delete(k);
                      window.location.reload();
                    });
                  } else {
                    window.location.reload();
                  }
                }).catch(function() {
                  window.location.reload();
                });
              } else {
                window.location.reload();
              }
            };
          }
        }
      })();

      window.deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-available'));
      });
    </script>

    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #F9F7FF; 
        background-image: linear-gradient(180deg, #F9F7FF 0%, #F4F0FF 100%);
        min-height: 100vh;
        color: #1e293b;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      @media print {
        body, html, #root {
          background-color: #ffffff !important;
          background-image: none !important;
          color: #000000 !important;
          min-height: auto !important;
          height: auto !important;
          overflow: visible !important;
        }
      }

      /* Dark Mode Body Override */
      html.dark body {
        background-color: #0f172a; /* slate-900 */
        background-image: linear-gradient(180deg, #0f172a 0%, #020617 100%);
        color: #f1f5f9; /* slate-100 */
      }
      
      /* Card Utility - Reverted to White */
      .app-card {
        background-color: #FFFFFF; 
        border-radius: 1.25rem; 
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        border: 1px solid rgba(226, 232, 240, 0.8); /* slate-200 */
        transition: background-color 0.3s ease, border-color 0.3s ease;
      }

      /* Dark Mode Card Override */
      html.dark .app-card {
        background-color: #1e293b; /* slate-800 */
        border-color: #334155; /* slate-700 */
        color: #f8fafc;
      }

      /* Custom Scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
          width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
          background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
          background: #cbd5e1;
          border-radius: 10px;
      }
      html.dark .custom-scrollbar::-webkit-scrollbar-thumb {
          background: #475569;
      }
      
      .animate-fade-in {
        animation: fadeIn 0.4s ease-out forwards;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* MODERN PAGE TRANSITION */
      .page-enter {
        animation: pageSlideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      @keyframes pageSlideUp {
        0% {
          opacity: 0;
          transform: translateY(15px) scale(0.98);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
    
      /* Animated Glow Border */
      .glow-border-container {
        position: relative;
        z-index: 0;
        border-radius: 9999px;
        overflow: hidden;
        padding: 2px;
      }
      .glow-border-container::before {
        content: '';
        position: absolute;
        z-index: -2;
        left: -50%;
        top: -50%;
        width: 200%;
        height: 200%;
        background-color: transparent;
        background-repeat: no-repeat;
        background-size: 50% 50%, 50% 50%;
        background-position: 0 0, 100% 0, 100% 100%, 0 100%;
        background-image: conic-gradient(from 0deg, transparent 0 340deg, #9333ea 360deg);
        animation: rotate 4s linear infinite;
      }
      .glow-border-container::after {
        content: '';
        position: absolute;
        z-index: -1;
        left: 2px;
        top: 2px;
        width: calc(100% - 4px);
        height: calc(100% - 4px);
        background: inherit;
        border-radius: 9999px;
      }
      @keyframes rotate {
        100% {
          transform: rotate(360deg);
        }
      }

    
      @keyframes shimmer {
        100% {
          transform: translateX(100%);
        }
      }
    </style>
</head>

          <div style="width: 52px; height: 52px; border-radius: 18px; background-color: #9333ea; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 15px -3px rgba(147, 51, 234, 0.3);">
